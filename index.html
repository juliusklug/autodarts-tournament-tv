<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1024">
  <meta name="description" content="Open Darts Masters – Turnier-Zuschaueransicht for AutoDarts">
  <title>Open Darts Masters for AutoDarts</title>
  <style>
    :root{
      color-scheme:dark;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --text:#f4f6fb;
      --muted:rgba(244,246,251,.58);
      --line:rgba(255,255,255,.10);
      --glass:rgba(12,16,34,.72);
      --glass2:rgba(15,21,47,.82);
      --pink:#ec3fb7;
      --pink2:#9f216b;
      --blue:#1a6eff;
      --blue2:#163ca9;
      --green:#2fd07b;
      --radius:24px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;color:var(--text);background:#060c1e}
    body{
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 8%,rgba(150,34,131,.22),transparent 30%),
        radial-gradient(circle at 84% 12%,rgba(36,77,189,.25),transparent 32%),
        radial-gradient(circle at 50% 82%,rgba(29,47,128,.23),transparent 42%),
        linear-gradient(135deg,#171535 0%,#0f1530 40%,#080f24 100%);
    }
    body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:0;opacity:.17}
    body:before{
      width:52vw;height:58vw;left:-18vw;top:8vh;
      background:linear-gradient(145deg,rgba(145,43,164,.42),rgba(46,63,179,.02));
      clip-path:polygon(0 12%,100% 0,72% 48%,100% 100%,12% 84%);
    }
    body:after{
      width:43vw;height:53vw;right:-14vw;bottom:-19vw;
      background:linear-gradient(150deg,rgba(33,84,208,.36),rgba(154,31,179,.02));
      clip-path:polygon(12% 0,100% 20%,75% 100%,0 70%);
    }
    button,input{font:inherit}
    #app{height:100%}
    .shell{
      position:relative;z-index:1;
      width:min(1800px,97vw);
      height:100vh;
      margin:auto;
      padding:14px 0 12px;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto;
      gap:10px;
    }
    header{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:64px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--pink),#6f4cff);box-shadow:0 8px 26px rgba(236,63,183,.18);font-size:20px}
    .brand-copy{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
    .brand-name{font-size:clamp(20px,2.25vw,36px);font-weight:950;letter-spacing:-.045em;text-transform:uppercase}
    .brand-sub{margin-top:5px;font-size:clamp(10px,.8vw,13px);font-weight:800;letter-spacing:.08em;color:rgba(244,246,251,.55)}
    .brand-sub strong{color:rgba(244,246,251,.82);font-weight:900}
    .tournament-meta{text-align:right}
    .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:900}
    .tournament-title{font-size:clamp(16px,1.8vw,26px);font-weight:850;margin-top:4px;line-height:1.05}
    .meta-line{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:4px;font-size:11px;color:var(--muted)}
    .live-dot{display:inline-flex;align-items:center;gap:7px}
    .live-dot i{display:block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 13px rgba(47,208,123,.8)}
    .main{display:grid;grid-template-rows:minmax(0,1fr) minmax(155px,24vh);gap:10px;min-height:0}
    .stage{position:relative;border:1px solid var(--line);border-radius:26px;padding:16px 18px;
      background:linear-gradient(145deg,rgba(21,24,53,.74),rgba(8,15,36,.82));
      box-shadow:0 20px 70px rgba(0,0,0,.28);backdrop-filter:blur(16px);overflow:hidden;min-height:0}
    .stage:before{content:"";position:absolute;inset:0;pointer-events:none;background:
      radial-gradient(circle at 50% 40%,rgba(77,93,217,.10),transparent 36%),
      linear-gradient(125deg,rgba(255,50,184,.03),transparent 35%,rgba(45,107,255,.05));}
    .live-stage{position:relative;display:grid;grid-template-columns:minmax(220px,.86fr) minmax(300px,1.12fr) minmax(220px,.86fr);align-items:center;gap:18px;height:100%}
    .player-panel{position:relative;border-radius:24px;padding:16px 16px 14px;min-width:0;
      border:1px solid rgba(255,255,255,.12);overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.20)}
    .player-panel.a{background:linear-gradient(150deg,rgba(245,64,190,.96),rgba(173,27,121,.93) 50%,rgba(76,27,95,.90))}
    .player-panel.b{background:linear-gradient(150deg,rgba(32,113,255,.97),rgba(29,74,199,.94) 50%,rgba(22,40,113,.92))}
    .player-panel.active{outline:2px solid rgba(255,255,255,.92);outline-offset:2px}
    .player-head{display:flex;align-items:center;gap:10px;font-size:clamp(16px,1.5vw,24px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.35);flex:0 0 auto;font-size:14px}
    .remaining{font-size:clamp(62px,7.1vw,118px);font-weight:950;line-height:.88;letter-spacing:-.07em;margin:12px 0 10px;text-shadow:0 5px 22px rgba(0,0,0,.14)}
    .legline{font-size:clamp(14px,1.2vw,18px);font-weight:820;opacity:.9}
    .board-column{display:grid;place-items:center;min-width:0;text-align:center;height:100%;align-content:center}
    .live-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:999px;
      font-size:10px;font-weight:950;letter-spacing:.14em;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.13);margin-bottom:8px}
    .live-badge i{width:7px;height:7px;border-radius:50%;background:var(--green)}
    .dartboard{width:min(100%,430px);max-height:42vh;aspect-ratio:1;display:block;filter:drop-shadow(0 14px 30px rgba(0,0,0,.30))}
    .visit-bar{display:grid;grid-template-columns:repeat(3,minmax(72px,1fr)) auto;gap:8px;align-items:center;width:min(100%,470px);margin-top:8px}
    .dart-pill,.visit-total{min-height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:rgba(5,10,30,.50);font-weight:900;font-size:14px}
    .dart-pill.empty{opacity:.35}
    .visit-total{padding:0 14px;font-size:18px;background:rgba(255,255,255,.09)}
    .format{margin-top:8px;color:var(--muted);font-size:12px;font-weight:760}
    .below{display:grid;grid-template-columns:.92fr 1.08fr;gap:10px;min-height:0}
    .card{border:1px solid var(--line);background:rgba(8,14,33,.68);backdrop-filter:blur(12px);border-radius:22px;padding:14px;min-width:0;overflow:hidden;min-height:0}
    .card h2{margin:0 0 10px;font-size:19px;line-height:1}
    .card-content{height:calc(100% - 30px);overflow:hidden}
    table{width:100%;border-collapse:collapse;font-size:clamp(11px,.92vw,15px)}
    th,td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.07);text-align:right}
    th:nth-child(2),td:nth-child(2){text-align:left}
    th{font-size:.78em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    tr.qualify{background:rgba(49,120,255,.10)}
    .round{margin:0 0 10px}.round:last-child{margin-bottom:0}
    .round h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
    .match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 10px;margin:4px 0;border-radius:12px;background:rgba(255,255,255,.042);font-size:13px}
    .match span:first-child{text-align:right}.match span:last-child{text-align:left}.match b{opacity:.7}
    .center-state{position:relative;height:100%;display:grid;place-items:center;text-align:center;padding:26px 30px;min-height:0}
    .state-box{width:min(950px,100%)}
    .state-icon{font-size:56px;line-height:1;margin-bottom:10px}
    .state-badge{display:inline-flex;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.23);
      font-size:11px;font-weight:950;letter-spacing:.15em;margin-bottom:12px}
    .state-title{font-size:clamp(32px,4.8vw,70px);font-weight:950;line-height:.95;letter-spacing:-.05em;margin:0}
    .state-sub{font-size:clamp(14px,1.25vw,20px);color:var(--muted);margin:12px auto 0;max-width:800px}
    .result-line{font-size:clamp(22px,3vw,46px);font-weight:900;margin:20px 0}
    .result-line b{font-size:1.18em;margin:0 12px}
    .next-block{margin:22px auto 0;padding-top:18px;border-top:1px solid var(--line);max-width:930px}
    .versus{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin:12px 0}
    .versus strong{font-size:clamp(24px,3.3vw,48px);line-height:1}
    .versus strong:first-child{text-align:right}.versus strong:last-child{text-align:left}.versus span{opacity:.35;font-weight:950}
    .champ{min-height:0}.champ .state-icon{font-size:88px}
    .empty{min-height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed rgba(255,255,255,.13);border-radius:16px;padding:14px;font-size:13px}
    footer{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:rgba(255,255,255,.38);padding:0 2px}
    .join{max-width:640px;margin:10vh auto 0;text-align:center;height:auto;display:block}
    .join .brand{justify-content:center}.join h1{font-size:clamp(46px,8vw,82px);margin:18px 0 8px}
    .join p{color:var(--muted)}
    .join form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:24px}
    .join input{min-width:0;padding:16px 17px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(7,12,32,.72);color:white;text-transform:uppercase;font-size:16px}
    .join button{border:0;border-radius:14px;padding:0 24px;font-weight:900;color:white;background:linear-gradient(135deg,var(--pink),#7155ff);cursor:pointer}
    .join-status{margin-top:14px;min-height:22px;color:var(--muted)}

    @media (max-width: 1200px){
      .live-stage{grid-template-columns:minmax(200px,.82fr) minmax(280px,1.1fr) minmax(200px,.82fr);gap:12px}
      .dartboard{max-height:38vh;width:min(100%,360px)}
      .remaining{font-size:clamp(54px,6.4vw,96px)}
    }
    @media(max-width:980px){
      body{overflow:auto}
      .shell{height:auto;min-height:100vh;padding-top:14px;padding-bottom:14px;display:block}
      .main{display:block}
      .stage{margin-bottom:10px}
      .live-stage{grid-template-columns:1fr;align-content:start;height:auto}
      .board-column{order:1}.player-panel.a{order:2}.player-panel.b{order:3}
      .dartboard{max-height:none;width:min(100%,360px)}
      .below{grid-template-columns:1fr}.card{min-height:210px}
    }
    @media(max-height:780px) and (min-width:981px){
      .shell{width:min(1840px,98vw);padding-top:10px;padding-bottom:8px;gap:8px}
      .main{grid-template-rows:minmax(0,1fr) minmax(138px,22vh);gap:8px}
      .stage{padding:12px 14px}
      .live-stage{gap:14px}
      .dartboard{width:min(100%,350px);max-height:35vh}
      .remaining{font-size:clamp(48px,6.3vw,90px);margin:8px 0 7px}
      .player-panel{padding:13px 14px 12px}
      .visit-bar{margin-top:6px}
      .dart-pill,.visit-total{min-height:34px;font-size:13px}
      .card{padding:12px}
      .card h2{font-size:17px;margin-bottom:8px}
      table{font-size:11px} th,td{padding:6px 5px}
      .match{padding:6px 8px;margin:3px 0;font-size:12px}
      footer{font-size:10px}
    }
  </style>
</head>
<body>
<div id="app"></div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2.95.0";

  const SUPABASE_URL = "https://vitejphsnbejhyydvkqc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_-7f4XSQrfOzRl3wI9PIZoQ_ySkSpAoI";
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const app = document.querySelector("#app");
  const qs = new URLSearchParams(location.search);
  let code = (qs.get("code") || "").trim().toUpperCase();
  let channel = null;

  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));

  const BOARD_NUMBERS = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];

  function polar(cx, cy, r, deg) {
    const rad = deg * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }

  function ringWedge(cx, cy, r0, r1, startDeg, endDeg) {
    const [x1,y1] = polar(cx,cy,r1,startDeg);
    const [x2,y2] = polar(cx,cy,r1,endDeg);
    const [x3,y3] = polar(cx,cy,r0,endDeg);
    const [x4,y4] = polar(cx,cy,r0,startDeg);
    return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r1} ${r1} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L ${x3.toFixed(2)} ${y3.toFixed(2)} A ${r0} ${r0} 0 0 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
  }

  function fallbackDartPoint(dart, index) {
    const cx = 180, cy = 180, R = 140;
    const number = Number(dart?.number);
    const multiplier = Number(dart?.multiplier);
    const bed = String(dart?.bed || "");
    if (number === 25) return {x:cx,y:cy};
    const at = BOARD_NUMBERS.indexOf(number);
    if (at < 0) return {x:cx,y:cy};
    const angle = -90 + at * 18;
    let radius = R * .76;
    if (multiplier === 3 || /triple/i.test(bed)) radius = R * .605;
    else if (multiplier === 2 || /double/i.test(bed)) radius = R * .976;
    else radius = R * (index % 2 ? .77 : .38);
    const [x,y] = polar(cx,cy,radius,angle);
    return {x,y};
  }

  function dartPoint(dart, index) {
    const x = Number(dart?.x), y = Number(dart?.y);
    // AutoDarts coordinates come in board space with the Y-axis inverted compared to SVG screen space.
    if (Number.isFinite(x) && Number.isFinite(y) && Math.hypot(x,y) <= 1.35) {
      return {x:180 + x*140,y:180 - y*140};
    }
    return fallbackDartPoint(dart,index);
  }

  function dartboardMarkup(board) {
    const cx=180,cy=180,R=140;
    const dark="#151719",light="#eee5d1",red="#d63443",green="#2e9b62",wire="rgba(255,255,255,.20)";
    let svg=`<svg class="dartboard" viewBox="0 0 360 360" role="img" aria-label="Live Dartboard">`;
    svg+=`<circle cx="${cx}" cy="${cy}" r="156" fill="#11141a" stroke="rgba(255,255,255,.20)" stroke-width="1.3"/>`;
    svg+=`<circle cx="${cx}" cy="${cy}" r="148" fill="#24272c" stroke="rgba(255,255,255,.10)" stroke-width=".8"/>`;
    BOARD_NUMBERS.forEach((num,i)=>{
      const center=-90+i*18,start=center-9,end=center+9;
      const single=i%2?light:dark, ring=i%2?green:red;
      svg+=`<path d="${ringWedge(cx,cy,R*.094,R*.582,start,end)}" fill="${single}" stroke="${wire}" stroke-width=".6"/>`;
      svg+=`<path d="${ringWedge(cx,cy,R*.582,R*.629,start,end)}" fill="${ring}" stroke="${wire}" stroke-width=".6"/>`;
      svg+=`<path d="${ringWedge(cx,cy,R*.629,R*.953,start,end)}" fill="${single}" stroke="${wire}" stroke-width=".6"/>`;
      svg+=`<path d="${ringWedge(cx,cy,R*.953,R,start,end)}" fill="${ring}" stroke="${wire}" stroke-width=".6"/>`;
      const [tx,ty]=polar(cx,cy,R*1.105,center);
      svg+=`<text x="${tx.toFixed(1)}" y="${(ty+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="900" fill="#f2f2f4">${num}</text>`;
    });
    svg+=`<circle cx="${cx}" cy="${cy}" r="${(R*.094).toFixed(1)}" fill="${green}" stroke="${wire}" stroke-width=".8"/>`;
    svg+=`<circle cx="${cx}" cy="${cy}" r="${(R*.037).toFixed(1)}" fill="${red}" stroke="${wire}" stroke-width=".8"/>`;
    const darts=Array.isArray(board?.darts)?board.darts.slice(0,3):[];
    darts.forEach((dart,i)=>{
      const p=dartPoint(dart,i), fills=["#ffffff","#ffe37a","#70ddff"];
      svg+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="10" fill="rgba(0,0,0,.48)"/>`;
      svg+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6.5" fill="${fills[i]}" stroke="#111" stroke-width="1.4"/>`;
      svg+=`<text x="${p.x.toFixed(1)}" y="${(p.y+3).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="950" fill="#111">${i+1}</text>`;
    });
    svg+=`</svg>`;
    return svg;
  }

  function joinScreen(message="") {
    app.innerHTML=`
      <main class="shell join">
        <div class="brand">
          <div class="brand-mark">🎯</div>
          <div class="brand-copy">
            <div class="brand-name">Open Darts Masters</div>
            <div class="brand-sub">for <strong>AutoDarts</strong></div>
          </div>
        </div>
        <h1>Turnier ansehen</h1>
        <p>Gib den TV-Code aus dem Tournament Companion ein.</p>
        <form id="joinForm">
          <input id="codeInput" placeholder="DART-XXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button>Öffnen</button>
        </form>
        <div class="join-status">${esc(message)}</div>
      </main>`;
    document.querySelector("#joinForm").addEventListener("submit",e=>{
      e.preventDefault();
      const value=document.querySelector("#codeInput").value.trim().toUpperCase();
      if(!value)return;
      const url=new URL(location.href);url.search="";url.searchParams.set("code",value);location.href=url.toString();
    });
  }

  function header(row,p){
    return `
      <header>
        <div class="brand">
          <div class="brand-mark">🎯</div>
          <div class="brand-copy">
            <div class="brand-name">Open Darts Masters</div>
            <div class="brand-sub">for <strong>AutoDarts</strong></div>
          </div>
        </div>
        <div class="tournament-meta">
          <div class="eyebrow">${esc(p.modeLabel||"Turnier")}</div>
          <div class="meta-line"><span>${esc(row.code)}</span><span class="live-dot"><i></i>Live verbunden</span></div>
        </div>
      </header>`;
  }

  function liveStage(current,liveMatch){
    const board=liveMatch.board||{};
    const darts=Array.isArray(board.darts)?board.darts.slice(0,3):[];
    const activeA=board.throwingSide==="A"?" active":"";
    const activeB=board.throwingSide==="B"?" active":"";
    return `
      <section class="stage">
        <div class="live-stage">
          <div class="player-panel a${activeA}">
            <div class="player-head"><span class="avatar">🎯</span><span>${esc(liveMatch.playerA||current?.playerA||"Spieler 1")}</span></div>
            <div class="remaining">${liveMatch.remainingA??"–"}</div>
            <div class="legline">Legs ${liveMatch.legsA??0}${liveMatch.setsA!=null?` · Sets ${liveMatch.setsA??0}`:""}</div>
          </div>
          <div class="board-column">
            <div class="live-badge"><i></i>AUTODARTS LIVE</div>
            ${dartboardMarkup(board)}
            <div class="visit-bar">
              ${[0,1,2].map(i=>darts[i]?`<div class="dart-pill">${esc(darts[i].label||`Dart ${i+1}`)}</div>`:`<div class="dart-pill empty">Dart ${i+1}</div>`).join("")}
              <div class="visit-total">${board.busted?"BUST":Number(board.turnPoints||0)}</div>
            </div>
            <div class="format">${esc(current?.format||"")}${board.throwingName?` · Am Wurf: ${esc(board.throwingName)}`:""}</div>
          </div>
          <div class="player-panel b${activeB}">
            <div class="player-head"><span class="avatar">🎯</span><span>${esc(liveMatch.playerB||current?.playerB||"Spieler 2")}</span></div>
            <div class="remaining">${liveMatch.remainingB??"–"}</div>
            <div class="legline">Legs ${liveMatch.legsB??0}${liveMatch.setsB!=null?` · Sets ${liveMatch.setsB??0}`:""}</div>
          </div>
        </div>
      </section>`;
  }

  function stateStage(state,p,next,lastMatch,aborted){
    if(state==="aborted"){
      const m=aborted||next||{};
      return `<section class="stage center-state"><div class="state-box">
        <div class="state-icon">⛔</div><div class="state-badge">MATCH ABGEBROCHEN</div>
        <h1 class="state-title">Nicht gewertet</h1>
        <div class="versus"><strong>${esc(m.playerA||"")}</strong><span>VS</span><strong>${esc(m.playerB||"")}</strong></div>
        <p class="state-sub">${esc(aborted?.reason||"Das AutoDarts-Match wurde abgebrochen. Das Turniermatch bleibt offen.")}</p>
        <p class="state-sub">Lege dasselbe Match in AutoDarts neu an. Erst wenn die neue Matchseite erkannt wird, schaltet Open Darts Masters wieder auf LIVE.</p>
      </div></section>`;
    }
    if(state==="intermission"){
      return `<section class="stage center-state"><div class="state-box">
        <div class="state-icon">⏸</div><div class="state-badge">MATCH BEENDET · PAUSE</div>
        ${lastMatch?`<div class="eyebrow">Letztes Ergebnis</div><div class="result-line">${esc(lastMatch.playerA)} <b>${esc(lastMatch.score||"")}</b> ${esc(lastMatch.playerB)}</div>`:""}
        <div class="next-block"><div class="eyebrow">Als Nächstes</div>
        ${next?`<div class="versus"><strong>${esc(next.playerA)}</strong><span>VS</span><strong>${esc(next.playerB)}</strong></div><div class="format">${esc(next.format||"")}</div>`:`<div class="empty">Nächstes Match wird vorbereitet.</div>`}
        <p class="state-sub">Warte auf den Start des neuen AutoDarts-Matches …</p></div>
      </div></section>`;
    }
    const focus=p.currentMatch||next;
    return `<section class="stage center-state"><div class="state-box">
      <div class="state-icon">🎯</div><div class="state-badge">BEREIT</div>
      <h1 class="state-title">${focus?"Nächstes Match":"Turnier bereit"}</h1>
      ${focus?`<div class="versus"><strong>${esc(focus.playerA)}</strong><span>VS</span><strong>${esc(focus.playerB)}</strong></div><div class="format">${esc(focus.format||"")}</div>`:`<p class="state-sub">Noch kein Match geplant.</p>`}
    </div></section>`;
  }

  function lowerPanels(standings,knockout){
    const rounds=[...new Set(knockout.map(m=>m.stage).filter(Boolean))];
    return `<div class="below">
      <section class="card"><h2>Tabelle</h2><div class="card-content">
        ${standings.length?`<table><thead><tr><th>#</th><th>Spieler</th><th>SP</th><th>S</th><th>LD</th><th>P</th></tr></thead><tbody>
          ${standings.map((r,i)=>`<tr class="${r.qualifies?"qualify":""}"><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.played??0}</td><td>${r.wins??0}</td><td>${Number(r.legDiff)>0?"+":""}${r.legDiff??0}</td><td>${r.points??0}</td></tr>`).join("")}
        </tbody></table>`:`<div class="empty">Bei direktem KO gibt es keine Vorrundentabelle.</div>`}
      </div></section>
      <section class="card"><h2>Turnierbaum</h2><div class="card-content">
        ${knockout.length?rounds.map(round=>`<div class="round"><h3>${esc(round)}</h3>${knockout.filter(m=>m.stage===round).map(m=>`<div class="match"><span>${esc(m.playerA)}</span><b>${m.status==="finished"?esc(m.score||""):"vs."}</b><span>${esc(m.playerB)}</span></div>`).join("")}</div>`).join(""):`<div class="empty">Finalrunde noch nicht gestartet.</div>`}
      </div></section>
    </div>`;
  }

  function renderSession(row){
    const p=row.payload||{};
    const current=p.currentMatch||null,next=p.nextMatch||null,lastMatch=p.lastMatch||null,aborted=p.abortedMatch||null;
    const liveMatch=p.liveMatch||null;
    const state=p.broadcastState||(liveMatch?.recognized?"live":"ready");
    const standings=Array.isArray(p.standings)?p.standings:[];
    const knockout=Array.isArray(p.knockout)?p.knockout:[];
    const champion=p.championName||"";

    app.innerHTML=`<main class="shell">
      ${header(row,p)}
      <div class="main">
        ${champion?`<section class="stage center-state champ"><div class="state-box"><div class="state-icon">🏆</div><div class="state-badge">TURNIERSIEGER</div><h1 class="state-title">${esc(champion)}</h1><p class="state-sub">${esc(row.title||p.tournamentName||"Open Darts Masters")}</p></div></section>`
          :(liveMatch?.recognized?liveStage(current,liveMatch):stateStage(state,p,next,lastMatch,aborted))}
        ${lowerPanels(standings,knockout)}
      </div>
      <footer><span>Open Darts Masters · for AutoDarts</span><span>Aktualisiert: ${new Date(row.updated_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</span></footer>
    </main>`;
  }

  async function load(){
    if(!code)return joinScreen();
    const {data,error}=await supabase.from("tournament_tv_sessions").select("id,code,title,payload,updated_at,expires_at").eq("code",code).maybeSingle();
    if(error||!data)return joinScreen("Turniercode nicht gefunden oder abgelaufen.");
    renderSession(data);
    channel=supabase.channel("tv:"+code).on("postgres_changes",{event:"UPDATE",schema:"public",table:"tournament_tv_sessions",filter:"code=eq."+code},payload=>renderSession(payload.new)).subscribe();
  }

  addEventListener("beforeunload",()=>{if(channel)supabase.removeChannel(channel)});
  load();
</script>
</body>
</html>
