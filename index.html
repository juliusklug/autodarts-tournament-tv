<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101636">
  <meta name="description" content="Dart Live – Live-Zuschaueransicht für den AutoDarts Tournament Companion">
  <title>Dart Live</title>
  <style>
    :root{
      color-scheme:dark;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --text:#f8f8fb;
      --muted:rgba(248,248,251,.58);
      --line:rgba(255,255,255,.11);
      --glass:rgba(13,18,43,.64);
      --glass2:rgba(25,28,55,.72);
      --pink:#ff42b8;
      --pink2:#c7198e;
      --blue:#3178ff;
      --blue2:#1834a0;
      --green:#32d583;
      --radius:25px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;color:var(--text);background:#07112a}
    body{
      min-height:100vh;
      overflow-x:hidden;
      background:
        radial-gradient(circle at 16% 8%,rgba(194,44,180,.30),transparent 31%),
        radial-gradient(circle at 84% 14%,rgba(48,93,220,.35),transparent 33%),
        radial-gradient(circle at 50% 78%,rgba(38,55,151,.30),transparent 42%),
        linear-gradient(135deg,#2a1248 0%,#151743 43%,#08132e 100%);
    }
    body:before,body:after{
      content:"";position:fixed;inset:auto;pointer-events:none;z-index:0;opacity:.22;filter:blur(.2px)
    }
    body:before{
      width:70vw;height:70vw;left:-25vw;top:15vh;
      background:linear-gradient(145deg,rgba(174,56,206,.75),rgba(46,63,179,.05));
      clip-path:polygon(0 10%,100% 0,72% 48%,100% 100%,13% 82%);
    }
    body:after{
      width:52vw;height:65vw;right:-19vw;bottom:-22vw;
      background:linear-gradient(150deg,rgba(35,102,255,.55),rgba(154,31,179,.05));
      clip-path:polygon(12% 0,100% 20%,75% 100%,0 70%);
    }
    button,input{font:inherit}
    .shell{position:relative;z-index:1;width:min(1700px,96vw);margin:auto;padding:24px 0 28px}
    header{display:flex;justify-content:space-between;align-items:center;gap:22px;margin-bottom:20px}
    .brand{display:flex;align-items:center;gap:14px}
    .brand-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--pink),#7d4cff);box-shadow:0 8px 30px rgba(255,66,184,.25);font-size:23px}
    .brand-name{font-size:clamp(24px,3vw,42px);font-weight:950;letter-spacing:-.04em;line-height:1}
    .brand-name span{opacity:.65;font-weight:750}
    .tournament-meta{text-align:right}
    .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:900}
    .tournament-title{font-size:clamp(18px,2vw,30px);font-weight:850;margin-top:5px}
    .meta-line{display:flex;justify-content:flex-end;gap:12px;align-items:center;margin-top:5px;font-size:12px;color:var(--muted)}
    .live-dot{display:inline-flex;align-items:center;gap:7px}
    .live-dot i{display:block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 13px rgba(50,213,131,.8)}
    .stage{position:relative;border:1px solid var(--line);border-radius:30px;padding:26px;
      background:linear-gradient(145deg,rgba(35,30,75,.62),rgba(12,21,54,.77));
      box-shadow:0 30px 90px rgba(0,0,0,.28);backdrop-filter:blur(18px);overflow:hidden}
    .stage:before{content:"";position:absolute;inset:0;pointer-events:none;background:
      radial-gradient(circle at 50% 45%,rgba(91,105,255,.14),transparent 38%),
      linear-gradient(125deg,rgba(255,50,184,.06),transparent 35%,rgba(45,107,255,.08));}
    .live-stage{position:relative;display:grid;grid-template-columns:minmax(260px,.75fr) minmax(390px,1.2fr) minmax(260px,.75fr);align-items:center;gap:28px;min-height:560px}
    .player-panel{position:relative;border-radius:26px;padding:24px 22px 22px;min-width:0;
      border:1px solid rgba(255,255,255,.11);overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.23)}
    .player-panel.a{background:linear-gradient(150deg,rgba(255,55,183,.95),rgba(177,24,128,.92) 48%,rgba(83,28,117,.86))}
    .player-panel.b{background:linear-gradient(150deg,rgba(56,123,255,.94),rgba(35,72,194,.91) 52%,rgba(25,35,105,.88))}
    .player-panel.active{outline:3px solid rgba(255,255,255,.90);outline-offset:3px}
    .player-head{display:flex;align-items:center;gap:11px;font-size:clamp(18px,2vw,28px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.35);flex:0 0 auto}
    .remaining{font-size:clamp(76px,9vw,145px);font-weight:950;line-height:.88;letter-spacing:-.075em;margin:25px 0 13px;text-shadow:0 5px 25px rgba(0,0,0,.15)}
    .legline{font-size:clamp(15px,1.5vw,21px);font-weight:800;opacity:.85}
    .board-column{display:grid;place-items:center;min-width:0;text-align:center}
    .live-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;
      font-size:11px;font-weight:950;letter-spacing:.14em;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.13);margin-bottom:10px}
    .live-badge i{width:7px;height:7px;border-radius:50%;background:var(--green)}
    .dartboard{width:min(100%,560px);aspect-ratio:1;display:block;filter:drop-shadow(0 18px 38px rgba(0,0,0,.36))}
    .visit-bar{display:grid;grid-template-columns:repeat(3,minmax(80px,1fr)) auto;gap:9px;align-items:center;width:min(100%,620px);margin-top:8px}
    .dart-pill,.visit-total{min-height:48px;display:grid;place-items:center;border-radius:14px;border:1px solid rgba(255,255,255,.11);background:rgba(5,10,30,.54);font-weight:900}
    .dart-pill.empty{opacity:.35}
    .visit-total{padding:0 17px;font-size:20px;background:rgba(255,255,255,.10)}
    .format{margin-top:12px;color:var(--muted);font-size:14px;font-weight:750}
    .below{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;margin-top:18px}
    .card{border:1px solid var(--line);background:rgba(9,15,39,.66);backdrop-filter:blur(14px);border-radius:23px;padding:20px;min-width:0}
    .card h2{margin:0 0 15px;font-size:22px}
    table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.15vw,18px)}
    th,td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.075);text-align:right}
    th:nth-child(2),td:nth-child(2){text-align:left}
    th{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    tr.qualify{background:rgba(49,120,255,.11)}
    .round{margin:0 0 16px}.round h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
    .match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 12px;margin:6px 0;border-radius:13px;background:rgba(255,255,255,.045)}
    .match span:first-child{text-align:right}.match span:last-child{text-align:left}.match b{opacity:.7}
    .center-state{position:relative;min-height:470px;display:grid;place-items:center;text-align:center;padding:40px}
    .state-box{width:min(950px,100%)}
    .state-icon{font-size:64px;line-height:1;margin-bottom:12px}
    .state-badge{display:inline-flex;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.23);
      font-size:11px;font-weight:950;letter-spacing:.15em;margin-bottom:16px}
    .state-title{font-size:clamp(38px,6vw,82px);font-weight:950;line-height:.95;letter-spacing:-.05em;margin:0}
    .state-sub{font-size:clamp(16px,1.6vw,23px);color:var(--muted);margin:15px auto 0;max-width:800px}
    .result-line{font-size:clamp(24px,3.5vw,54px);font-weight:900;margin:26px 0}
    .result-line b{font-size:1.25em;margin:0 15px}
    .next-block{margin:30px auto 0;padding-top:24px;border-top:1px solid var(--line);max-width:930px}
    .versus{display:grid;grid-template-columns:1fr auto 1fr;gap:22px;align-items:center;margin:14px 0}
    .versus strong{font-size:clamp(28px,4vw,60px);line-height:1}
    .versus strong:first-child{text-align:right}.versus strong:last-child{text-align:left}.versus span{opacity:.35;font-weight:950}
    .champ{min-height:520px}
    .champ .state-icon{font-size:100px}
    .empty{min-height:145px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed rgba(255,255,255,.13);border-radius:16px;padding:20px}
    footer{display:flex;justify-content:space-between;gap:20px;margin-top:15px;font-size:12px;color:rgba(255,255,255,.38)}
    .join{max-width:640px;margin:12vh auto 0;text-align:center}
    .join .brand{justify-content:center}.join h1{font-size:clamp(46px,8vw,82px);margin:18px 0 8px}
    .join p{color:var(--muted)}
    .join form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:24px}
    .join input{min-width:0;padding:16px 17px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(7,12,32,.72);color:white;text-transform:uppercase;font-size:16px}
    .join button{border:0;border-radius:14px;padding:0 24px;font-weight:900;color:white;background:linear-gradient(135deg,var(--pink),#7155ff);cursor:pointer}
    .join-status{margin-top:14px;min-height:22px;color:var(--muted)}
    @media(max-width:1100px){
      .live-stage{grid-template-columns:1fr 1.2fr;min-height:0}
      .player-panel.b{grid-column:1}.board-column{grid-column:2;grid-row:1 / span 2}.player-panel.a{grid-column:1}
      .below{grid-template-columns:1fr}
    }
    @media(max-width:760px){
      .shell{width:min(96vw,720px);padding-top:14px}header{align-items:flex-start}.tournament-meta{max-width:48%}
      .stage{padding:14px;border-radius:22px}.live-stage{grid-template-columns:1fr;gap:12px}.board-column{grid-column:1;grid-row:1}.player-panel.a,.player-panel.b{grid-column:1}
      .player-panel{padding:18px}.remaining{font-size:84px}.visit-bar{grid-template-columns:repeat(3,1fr);}.visit-total{grid-column:1/-1}
      .below{grid-template-columns:1fr}.card{padding:15px}.center-state{min-height:390px;padding:24px 10px}
      .join form{grid-template-columns:1fr}.join button{padding:15px}
      .versus{gap:10px}.meta-line{flex-wrap:wrap}
    }
  </style>
</head>
<body>
<div id="app"></div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2.95.0";

  const SUPABASE_URL = "https://vitejphsnbejhyydvkqc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_-7f4XSQrfOzRl3wI9PIZoQ_ySkSpAoI";
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const app = document.querySelector("#app");
  const qs = new URLSearchParams(location.search);
  let code = (qs.get("code") || "").trim().toUpperCase();
  let channel = null;

  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));

  const BOARD_NUMBERS = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];

  function polar(cx, cy, r, deg) {
    const rad = deg * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }

  function ringWedge(cx, cy, r0, r1, startDeg, endDeg) {
    const [x1,y1] = polar(cx,cy,r1,startDeg);
    const [x2,y2] = polar(cx,cy,r1,endDeg);
    const [x3,y3] = polar(cx,cy,r0,endDeg);
    const [x4,y4] = polar(cx,cy,r0,startDeg);
    return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r1} ${r1} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L ${x3.toFixed(2)} ${y3.toFixed(2)} A ${r0} ${r0} 0 0 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
  }

  function fallbackDartPoint(dart, index) {
    const cx = 180, cy = 180, R = 140;
    const number = Number(dart?.number);
    const multiplier = Number(dart?.multiplier);
    const bed = String(dart?.bed || "");
    if (number === 25) return {x:cx,y:cy};
    const at = BOARD_NUMBERS.indexOf(number);
    if (at < 0) return {x:cx,y:cy};
    const angle = -90 + at * 18;
    let radius = R * .76;
    if (multiplier === 3 || /triple/i.test(bed)) radius = R * .605;
    else if (multiplier === 2 || /double/i.test(bed)) radius = R * .976;
    else radius = R * (index % 2 ? .77 : .38);
    const [x,y] = polar(cx,cy,radius,angle);
    return {x,y};
  }

  function dartPoint(dart, index) {
    const x = Number(dart?.x), y = Number(dart?.y);
    if (Number.isFinite(x) && Number.isFinite(y) && Math.hypot(x,y) <= 1.35) {
      return {x:180 + x*140,y:180 + y*140};
    }
    return fallbackDartPoint(dart,index);
  }

  function dartboardMarkup(board) {
    const cx=180,cy=180,R=140;
    const dark="#151719",light="#eee5d1",red="#d63443",green="#2e9b62",wire="rgba(255,255,255,.20)";
    let svg=`<svg class="dartboard" viewBox="0 0 360 360" role="img" aria-label="Live Dartboard">`;
    svg+=`<circle cx="${cx}" cy="${cy}" r="157" fill="#11141a" stroke="rgba(255,213,85,.72)" stroke-width="3"/>`;
    svg+=`<circle cx="${cx}" cy="${cy}" r="148" fill="#24272c"/>`;
    BOARD_NUMBERS.forEach((num,i)=>{
      const center=-90+i*18,start=center-9,end=center+9;
      const single=i%2?light:dark, ring=i%2?green:red;
      svg+=`<path d="${ringWedge(cx,cy,R*.094,R*.582,start,end)}" fill="${single}" stroke="${wire}" stroke-width=".6"/>`;
      svg+=`<path d="${ringWedge(cx,cy,R*.582,R*.629,start,end)}" fill="${ring}" stroke="${wire}" stroke-width=".6"/>`;
      svg+=`<path d="${ringWedge(cx,cy,R*.629,R*.953,start,end)}" fill="${single}" stroke="${wire}" stroke-width=".6"/>`;
      svg+=`<path d="${ringWedge(cx,cy,R*.953,R,start,end)}" fill="${ring}" stroke="${wire}" stroke-width=".6"/>`;
      const [tx,ty]=polar(cx,cy,R*1.105,center);
      svg+=`<text x="${tx.toFixed(1)}" y="${(ty+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="900" fill="#f2f2f4">${num}</text>`;
    });
    svg+=`<circle cx="${cx}" cy="${cy}" r="${(R*.094).toFixed(1)}" fill="${green}" stroke="${wire}" stroke-width=".8"/>`;
    svg+=`<circle cx="${cx}" cy="${cy}" r="${(R*.037).toFixed(1)}" fill="${red}" stroke="${wire}" stroke-width=".8"/>`;
    const darts=Array.isArray(board?.darts)?board.darts.slice(0,3):[];
    darts.forEach((dart,i)=>{
      const p=dartPoint(dart,i), fills=["#ffffff","#ffe37a","#70ddff"];
      svg+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="10" fill="rgba(0,0,0,.48)"/>`;
      svg+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6.5" fill="${fills[i]}" stroke="#111" stroke-width="1.4"/>`;
      svg+=`<text x="${p.x.toFixed(1)}" y="${(p.y+3).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="950" fill="#111">${i+1}</text>`;
    });
    svg+=`</svg>`;
    return svg;
  }

  function joinScreen(message="") {
    app.innerHTML=`
      <main class="shell join">
        <div class="brand"><div class="brand-mark">🎯</div><div class="brand-name">Dart <span>Live</span></div></div>
        <h1>Turnier ansehen</h1>
        <p>Gib den TV-Code aus dem Tournament Companion ein.</p>
        <form id="joinForm">
          <input id="codeInput" placeholder="DART-XXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button>Öffnen</button>
        </form>
        <div class="join-status">${esc(message)}</div>
      </main>`;
    document.querySelector("#joinForm").addEventListener("submit",e=>{
      e.preventDefault();
      const value=document.querySelector("#codeInput").value.trim().toUpperCase();
      if(!value)return;
      const url=new URL(location.href);url.search="";url.searchParams.set("code",value);location.href=url.toString();
    });
  }

  function header(row,p){
    return `
      <header>
        <div class="brand"><div class="brand-mark">🎯</div><div class="brand-name">Dart <span>Live</span></div></div>
        <div class="tournament-meta">
          <div class="eyebrow">${esc(p.modeLabel||"Turnier")}</div>
          <div class="tournament-title">${esc(row.title||p.tournamentName||"Dart Live")}</div>
          <div class="meta-line"><span>${esc(row.code)}</span><span class="live-dot"><i></i>Live verbunden</span></div>
        </div>
      </header>`;
  }

  function liveStage(current,liveMatch){
    const board=liveMatch.board||{};
    const darts=Array.isArray(board.darts)?board.darts.slice(0,3):[];
    const activeA=board.throwingSide==="A"?" active":"";
    const activeB=board.throwingSide==="B"?" active":"";
    return `
      <section class="stage">
        <div class="live-stage">
          <div class="player-panel a${activeA}">
            <div class="player-head"><span class="avatar">🎯</span><span>${esc(liveMatch.playerA||current?.playerA||"Spieler 1")}</span></div>
            <div class="remaining">${liveMatch.remainingA??"–"}</div>
            <div class="legline">Legs ${liveMatch.legsA??0}${liveMatch.setsA!=null?` · Sets ${liveMatch.setsA??0}`:""}</div>
          </div>
          <div class="board-column">
            <div class="live-badge"><i></i>AUTODARTS LIVE</div>
            ${dartboardMarkup(board)}
            <div class="visit-bar">
              ${[0,1,2].map(i=>darts[i]?`<div class="dart-pill">${esc(darts[i].label||`Dart ${i+1}`)}</div>`:`<div class="dart-pill empty">Dart ${i+1}</div>`).join("")}
              <div class="visit-total">${board.busted?"BUST":Number(board.turnPoints||0)}</div>
            </div>
            <div class="format">${esc(current?.format||"")}${board.throwingName?` · Am Wurf: ${esc(board.throwingName)}`:""}</div>
          </div>
          <div class="player-panel b${activeB}">
            <div class="player-head"><span class="avatar">🎯</span><span>${esc(liveMatch.playerB||current?.playerB||"Spieler 2")}</span></div>
            <div class="remaining">${liveMatch.remainingB??"–"}</div>
            <div class="legline">Legs ${liveMatch.legsB??0}${liveMatch.setsB!=null?` · Sets ${liveMatch.setsB??0}`:""}</div>
          </div>
        </div>
      </section>`;
  }

  function stateStage(state,p,next,lastMatch,aborted){
    if(state==="aborted"){
      const m=aborted||next||{};
      return `<section class="stage center-state"><div class="state-box">
        <div class="state-icon">⛔</div><div class="state-badge">MATCH ABGEBROCHEN</div>
        <h1 class="state-title">Nicht gewertet</h1>
        <div class="versus"><strong>${esc(m.playerA||"")}</strong><span>VS</span><strong>${esc(m.playerB||"")}</strong></div>
        <p class="state-sub">${esc(aborted?.reason||"Das AutoDarts-Match wurde abgebrochen. Das Turniermatch bleibt offen.")}</p>
        <p class="state-sub">Lege dasselbe Match in AutoDarts neu an. Erst wenn die neue Matchseite erkannt wird, schaltet Dart Live wieder auf LIVE.</p>
      </div></section>`;
    }
    if(state==="intermission"){
      return `<section class="stage center-state"><div class="state-box">
        <div class="state-icon">⏸</div><div class="state-badge">MATCH BEENDET · PAUSE</div>
        ${lastMatch?`<div class="eyebrow">Letztes Ergebnis</div><div class="result-line">${esc(lastMatch.playerA)} <b>${esc(lastMatch.score||"")}</b> ${esc(lastMatch.playerB)}</div>`:""}
        <div class="next-block"><div class="eyebrow">Als Nächstes</div>
        ${next?`<div class="versus"><strong>${esc(next.playerA)}</strong><span>VS</span><strong>${esc(next.playerB)}</strong></div><div class="format">${esc(next.format||"")}</div>`:`<div class="empty">Nächstes Match wird vorbereitet.</div>`}
        <p class="state-sub">Warte auf den Start des neuen AutoDarts-Matches …</p></div>
      </div></section>`;
    }
    const focus=p.currentMatch||next;
    return `<section class="stage center-state"><div class="state-box">
      <div class="state-icon">🎯</div><div class="state-badge">BEREIT</div>
      <h1 class="state-title">${focus?"Nächstes Match":"Turnier bereit"}</h1>
      ${focus?`<div class="versus"><strong>${esc(focus.playerA)}</strong><span>VS</span><strong>${esc(focus.playerB)}</strong></div><div class="format">${esc(focus.format||"")}</div>`:`<p class="state-sub">Noch kein Match geplant.</p>`}
    </div></section>`;
  }

  function lowerPanels(standings,knockout){
    const rounds=[...new Set(knockout.map(m=>m.stage).filter(Boolean))];
    return `<div class="below">
      <section class="card"><h2>Tabelle</h2>
        ${standings.length?`<table><thead><tr><th>#</th><th>Spieler</th><th>SP</th><th>S</th><th>LD</th><th>P</th></tr></thead><tbody>
          ${standings.map((r,i)=>`<tr class="${r.qualifies?"qualify":""}"><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.played??0}</td><td>${r.wins??0}</td><td>${Number(r.legDiff)>0?"+":""}${r.legDiff??0}</td><td>${r.points??0}</td></tr>`).join("")}
        </tbody></table>`:`<div class="empty">Bei direktem KO gibt es keine Vorrundentabelle.</div>`}
      </section>
      <section class="card"><h2>Turnierbaum</h2>
        ${knockout.length?rounds.map(round=>`<div class="round"><h3>${esc(round)}</h3>${knockout.filter(m=>m.stage===round).map(m=>`<div class="match"><span>${esc(m.playerA)}</span><b>${m.status==="finished"?esc(m.score||""):"vs."}</b><span>${esc(m.playerB)}</span></div>`).join("")}</div>`).join(""):`<div class="empty">Finalrunde noch nicht gestartet.</div>`}
      </section>
    </div>`;
  }

  function renderSession(row){
    const p=row.payload||{};
    const current=p.currentMatch||null,next=p.nextMatch||null,lastMatch=p.lastMatch||null,aborted=p.abortedMatch||null;
    const liveMatch=p.liveMatch||null;
    const state=p.broadcastState||(liveMatch?.recognized?"live":"ready");
    const standings=Array.isArray(p.standings)?p.standings:[];
    const knockout=Array.isArray(p.knockout)?p.knockout:[];
    const champion=p.championName||"";

    app.innerHTML=`<main class="shell">
      ${header(row,p)}
      ${champion?`<section class="stage center-state champ"><div class="state-box"><div class="state-icon">🏆</div><div class="state-badge">TURNIERSIEGER</div><h1 class="state-title">${esc(champion)}</h1><p class="state-sub">${esc(row.title||p.tournamentName||"Dart Live")}</p></div></section>`
        :(liveMatch?.recognized?liveStage(current,liveMatch):stateStage(state,p,next,lastMatch,aborted))}
      ${lowerPanels(standings,knockout)}
      <footer><span>Dart Live · AutoDarts Tournament Companion</span><span>Aktualisiert: ${new Date(row.updated_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</span></footer>
    </main>`;
  }

  async function load(){
    if(!code)return joinScreen();
    const {data,error}=await supabase.from("tournament_tv_sessions").select("id,code,title,payload,updated_at,expires_at").eq("code",code).maybeSingle();
    if(error||!data)return joinScreen("Turniercode nicht gefunden oder abgelaufen.");
    renderSession(data);
    channel=supabase.channel("tv:"+code).on("postgres_changes",{event:"UPDATE",schema:"public",table:"tournament_tv_sessions",filter:"code=eq."+code},payload=>renderSession(payload.new)).subscribe();
  }

  addEventListener("beforeunload",()=>{if(channel)supabase.removeChannel(channel)});
  load();
</script>
</body>
</html>
